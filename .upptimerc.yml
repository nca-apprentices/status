owner: nca-apprentices
repo: status

# The production hosts. jjforge and the ops portal answer every request
# with a redirect to the GitHub login, so a 302 there means the node,
# Traefik, and oauth2-proxy are up, not the app behind the login.
sites:
  - name: ncaleague
    url: https://ncaleague.nca-apprentices.dev
  - name: jjforge
    url: https://jjforge.nca-apprentices.dev
    expectedStatusCodes: [200, 302]
  - name: Ops portal
    url: https://ops.nca-apprentices.dev
    expectedStatusCodes: [200, 302]

status-website:
  baseUrl: /status
  name: nca-apprentices status
  introTitle: "**nca-apprentices** services"
  introMessage: Checked from GitHub Actions about every 5 minutes. Each outage opens an issue in this repository.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
