name: Deploy

# Checks each PR and deploys what lands on main. The Worker keeps its
# HEARTBEAT_TOKEN secret across deploys, see README.md.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Check
        run: mise run check
      - name: Test
        run: mise run test
      # Only this step gets the token, so a PR's dependencies never see it.
      - name: Deploy
        if: github.event_name == 'push'
        run: mise run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
